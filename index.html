        const submitLeadForm = async (payload) => {
            // 1. Client-side browser storage backup
            try {
                const existing = JSON.parse(localStorage.getItem('eagle_stack_leads') || '[]');
                existing.push({ ...payload, timestamp: new Date().toISOString() });
                localStorage.setItem('eagle_stack_leads', JSON.stringify(existing));
            } catch (err) {
                console.warn('LocalStorage backup note:', err);
            }

            // 2. Dispatch to live webhook if configured
            if (SITE_CONFIG.formWebhookUrl && SITE_CONFIG.formWebhookUrl.trim() !== "") {
                try {
                    const res = await fetch(SITE_CONFIG.formWebhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        return { status: 'delivered', message: 'Delivered to Eagle Stack Media CRM' };
                    } else {
                        return { status: 'webhook_failed', message: `Webhook responded with status ${res.status}` };
                    }
                } catch (fetchErr) {
                    return { status: 'network_failed', message: fetchErr.message || 'Network request failed' };
                }

        let lucideBatchScheduled = false;

                lucideBatchScheduled = false;
            });

        // Native High-Speed Icon Component

        // =========================================================================
        // 1. MINIMAL 3D HOVER-READY PARTICLE FIELD (Three.js Constellation Canvas)
        // =========================================================================
        function ThreeJsHeroEcosystem() {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!window.THREE || !containerRef.current) return;

                const container = containerRef.current;
                let width = container.clientWidth || window.innerWidth;
                let height = container.clientHeight || 620;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
                camera.position.set(0, 0, 26);

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                // Create soft circular radial gradient sprite texture for clean minimal dots
                const spriteCanvas = document.createElement('canvas');
                spriteCanvas.width = 64;
                spriteCanvas.height = 64;
                const ctx = spriteCanvas.getContext('2d');
                const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.45, 'rgba(255, 255, 255, 0.85)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 64, 64);
                const particleTexture = new THREE.CanvasTexture(spriteCanvas);

                // Particle data setup (minimal 130 particles)
                const particleCount = window.innerWidth < 640 ? 75 : 130;
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                const basePositions = [];
                const driftOffsets = [];

                const goldColor = new THREE.Color(0xC6A15B);
                const forestColor = new THREE.Color(0x092B23);

                for (let i = 0; i < particleCount; i++) {
                    const bx = (Math.random() - 0.5) * 42;
                    const by = (Math.random() - 0.5) * 24;
                    const bz = (Math.random() - 0.5) * 14;

                    positions[i * 3] = bx;
                    positions[i * 3 + 1] = by;
                    positions[i * 3 + 2] = bz;

                    basePositions.push({ x: bx, y: by, z: bz });
                    driftOffsets.push({
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.4 + Math.random() * 0.6,
                        ampX: 0.3 + Math.random() * 0.5,
                        ampY: 0.3 + Math.random() * 0.5
                    });

                    const c = i % 3 === 0 ? goldColor : forestColor;
                    colors[i * 3] = c.r;
                    colors[i * 3 + 1] = c.g;
                    colors[i * 3 + 2] = c.b;
                }

                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const particleMat = new THREE.PointsMaterial({
                    size: 0.55,
                    map: particleTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.72,
                    depthWrite: false
                });

                const particleSystem = new THREE.Points(particleGeo, particleMat);
                scene.add(particleSystem);

                // Delicate connecting constellation lines
                const maxConnections = particleCount * 6;
                const linePositions = new Float32Array(maxConnections * 6);
                const lineGeo = new THREE.BufferGeometry();
                lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

                const lineMat = new THREE.LineBasicMaterial({
                    color: 0xC6A15B,
                    transparent: true,
                    opacity: 0.16,
                    depthWrite: false
                });
                const lineSegments = new THREE.LineSegments(lineGeo, lineMat);
                scene.add(lineSegments);

                // Smooth hover-ready pointer state
                const pointer = { x: 0, y: 0, worldX: 999, worldY: 999, active: false };

                const updatePointer = (clientX, clientY) => {
                    const rect = container.getBoundingClientRect();
                    if (clientY < rect.top || clientY > rect.bottom) {
                        pointer.active = false;
                        return;
                    }
                    const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
                    const ndcY = -(((clientY - rect.top) / rect.height) * 2 - 1);
                    pointer.x = ndcX;
                    pointer.y = ndcY;
                    pointer.worldX = ndcX * 21;
                    pointer.worldY = ndcY * 12;
                    pointer.active = true;
                };

                const onMouseMove = (e) => updatePointer(e.clientX, e.clientY);
                const onTouchMove = (e) => {
                    if (e.touches && e.touches[0]) {
                        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
                    }
                };
                const onPointerLeave = () => { pointer.active = false; };

                window.addEventListener('mousemove', onMouseMove, { passive: true });
                window.addEventListener('touchmove', onTouchMove, { passive: true });
                window.addEventListener('mouseleave', onPointerLeave, { passive: true });

                let isVisible = true;
                const observer = new IntersectionObserver(([entry]) => {
                    isVisible = entry.isIntersecting;
                }, { threshold: 0.05 });
                observer.observe(container);

                const clock = new THREE.Clock();
                let animId;

                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    if (!isVisible) return;

                    const t = clock.getElapsedTime();
                    const posAttr = particleGeo.attributes.position;
                    const posArr = posAttr.array;

                    // Subtle camera parallax on hover
                    const targetCamX = pointer.active ? pointer.x * 1.6 : 0;
                    const targetCamY = pointer.active ? pointer.y * 1.1 : 0;
                    camera.position.x += (targetCamX - camera.position.x) * 0.04;
                    camera.position.y += (targetCamY - camera.position.y) * 0.04;
                    camera.lookAt(0, 0, 0);

                    // Update particles with gentle organic drift + hover repulsion
                    for (let i = 0; i < particleCount; i++) {
                        const base = basePositions[i];
                        const drift = driftOffsets[i];

                        let targetX = base.x + Math.sin(t * drift.speed + drift.phase) * drift.ampX;
                        let targetY = base.y + Math.cos(t * drift.speed + drift.phase) * drift.ampY;
                        let targetZ = base.z + Math.sin(t * 0.5 + drift.phase) * 0.6;

                        if (pointer.active) {
                            const dx = targetX - pointer.worldX;
                            const dy = targetY - pointer.worldY;
                            const distSq = dx * dx + dy * dy;
                            const hoverRadius = 7.5;
                            if (distSq < hoverRadius * hoverRadius && distSq > 0.001) {
                                const dist = Math.sqrt(distSq);
                                const force = (1 - dist / hoverRadius) * 2.8;
                                targetX += (dx / dist) * force;
                                targetY += (dy / dist) * force;
                                targetZ += force * 0.9;
                            }
                        }

                        const idx = i * 3;
                        posArr[idx] += (targetX - posArr[idx]) * 0.08;
                        posArr[idx + 1] += (targetY - posArr[idx + 1]) * 0.08;
                        posArr[idx + 2] += (targetZ - posArr[idx + 2]) * 0.08;
                    }
                    posAttr.needsUpdate = true;

                    // Update minimal connecting lines between nearby particles
                    let lineIndex = 0;
                    const connectDistSq = 36; // distance threshold 6 units
                    for (let i = 0; i < particleCount; i++) {
                        const ix = posArr[i * 3];
                        const iy = posArr[i * 3 + 1];
                        const iz = posArr[i * 3 + 2];
                        for (let j = i + 1; j < particleCount; j++) {
                            if (lineIndex >= maxConnections) break;
                            const jx = posArr[j * 3];
                            const jy = posArr[j * 3 + 1];
                            const jz = posArr[j * 3 + 2];
                            const dSq = (ix - jx) * (ix - jx) + (iy - jy) * (iy - jy) + (iz - jz) * (iz - jz);
                            if (dSq < connectDistSq) {
                                const lIdx = lineIndex * 6;
                                linePositions[lIdx] = ix;
                                linePositions[lIdx + 1] = iy;
                                linePositions[lIdx + 2] = iz;
                                linePositions[lIdx + 3] = jx;
                                linePositions[lIdx + 4] = jy;
                                linePositions[lIdx + 5] = jz;
                                lineIndex++;
                            }
                        }
                    }
                    lineGeo.setDrawRange(0, lineIndex * 2);
                    lineGeo.attributes.position.needsUpdate = true;

                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    if (!container) return;
                    width = container.clientWidth || window.innerWidth;
                    height = container.clientHeight || 620;
                    camera.aspect = width / height;
                    camera.updateProjectionMatrix();
                    renderer.setSize(width, height);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(animId);
                    observer.disconnect();
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('mouseleave', onPointerLeave);
                    window.removeEventListener('resize', handleResize);
                    particleTexture.dispose();
                    particleGeo.dispose();
                    particleMat.dispose();
                    lineGeo.dispose();
                    lineMat.dispose();
                    renderer.dispose();
                };
            }, []);

            return (
                <div 
                    ref={containerRef} 
                    className="absolute inset-0 pointer-events-none opacity-80 z-0 overflow-hidden" 
                    aria-hidden="true"
                />
            );
        }

        // =========================================================================
        // 2. INTERACTIVE 3D ARCHITECTURAL VILLA VIEWER (PropSouq AI Flagship)
        // =========================================================================
        function ThreeJsArchitecturalViewer({ activeFloor = 'all' }) {
            const canvasContainerRef = useRef(null);
            const controlsRef = useRef({ isDragging: false, prevX: 0, prevY: 0, rotY: 0.6, rotX: 0.35 });

            useEffect(() => {
                if (!window.THREE || !canvasContainerRef.current) return;

                const container = canvasContainerRef.current;
                const width = container.clientWidth;
                const height = container.clientHeight;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
                camera.position.set(16, 12, 18);
                camera.lookAt(0, 1.5, 0);

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const ambLight = new THREE.AmbientLight(0xffffff, 0.9);
                scene.add(ambLight);

                const dirLight1 = new THREE.DirectionalLight(0xC6A15B, 1.8);
                dirLight1.position.set(10, 20, 15);
                scene.add(dirLight1);

                const dirLight2 = new THREE.DirectionalLight(0x092B23, 1.2);
                dirLight2.position.set(-15, 10, -10);
                scene.add(dirLight2);

                const buildingGroup = new THREE.Group();
                scene.add(buildingGroup);

                const goldWireMat = new THREE.MeshStandardMaterial({
                    color: 0xC6A15B,
                    metalness: 0.9,
                    roughness: 0.2,
                    wireframe: true
                });
                const glassMat = new THREE.MeshPhysicalMaterial({
                    color: 0x16483c,
                    transparent: true,
                    opacity: 0.38,
                    roughness: 0.1,
                    metalness: 0.1,
                    transmission: 0.6,
                    ior: 1.5
                });
                const slabMat = new THREE.MeshStandardMaterial({
                    color: 0x092B23,
                    roughness: 0.4,
                    metalness: 0.5
                });
                const accentGoldMat = new THREE.MeshStandardMaterial({
                    color: 0xC6A15B,
                    metalness: 0.8,
                    roughness: 0.2
                });

                // Foundation Plinth
                const baseGeo = new THREE.BoxGeometry(11, 0.4, 11);
                const baseMesh = new THREE.Mesh(baseGeo, slabMat);
                baseMesh.position.y = 0;
                buildingGroup.add(baseMesh);

                const gridHelper = new THREE.GridHelper(10.5, 12, 0xC6A15B, 0x16483c);
                gridHelper.position.y = 0.22;
                buildingGroup.add(gridHelper);

                // Ground Floor
                const groundGroup = new THREE.Group();
                buildingGroup.add(groundGroup);
                const gfLivingGeo = new THREE.BoxGeometry(6.5, 2.6, 6.2);
                const gfLiving = new THREE.Mesh(gfLivingGeo, glassMat);
                gfLiving.position.set(-0.8, 1.5, -0.6);
                groundGroup.add(gfLiving);
                const gfWire = new THREE.Mesh(gfLivingGeo, goldWireMat);
                gfWire.position.copy(gfLiving.position);
                groundGroup.add(gfWire);

                // First Floor
                const ffGroup = new THREE.Group();
                buildingGroup.add(ffGroup);
                const midSlab = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.3, 7.8), slabMat);
                midSlab.position.set(-0.2, 2.9, -0.2);
                ffGroup.add(midSlab);
                const ffVolumeGeo = new THREE.BoxGeometry(7.2, 2.6, 6.6);
                const ffVolume = new THREE.Mesh(ffVolumeGeo, glassMat);
                ffVolume.position.set(-0.6, 4.35, -0.4);
                ffGroup.add(ffVolume);
                const ffWire = new THREE.Mesh(ffVolumeGeo, goldWireMat);
                ffWire.position.copy(ffVolume.position);
                ffGroup.add(ffWire);

                // Terrace Floor
                const terraceGroup = new THREE.Group();
                buildingGroup.add(terraceGroup);
                const roofSlab = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.25, 7.0), slabMat);
                roofSlab.position.set(-0.6, 5.8, -0.4);
                terraceGroup.add(roofSlab);

                for (let i = -2.8; i <= 2.8; i += 0.8) {
                    const slat = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.15, 0.12), accentGoldMat);
                    slat.position.set(-0.6 + i * 0.4, 6.4, 0.8);
                    terraceGroup.add(slat);
                }

                const updateFloorVisibility = (mode) => {
                    if (mode === 'ground') {
                        groundGroup.visible = true;
                        ffGroup.visible = false;
                        terraceGroup.visible = false;
                    } else if (mode === 'first') {
                        groundGroup.visible = true;
                        ffGroup.visible = true;
                        ffGroup.position.y = 0;
                        terraceGroup.visible = false;
                    } else {
                        groundGroup.visible = true;
                        ffGroup.visible = true;
                        ffGroup.position.y = 0;
                        terraceGroup.visible = true;
                    }
                };
                updateFloorVisibility(activeFloor);

                const controls = controlsRef.current;
                const onPointerDown = (e) => {
                    controls.isDragging = true;
                    controls.prevX = e.clientX;
                    controls.prevY = e.clientY;
                };
                const onPointerMove = (e) => {
                    if (!controls.isDragging) return;
                    const deltaX = e.clientX - controls.prevX;
                    const deltaY = e.clientY - controls.prevY;
                    controls.rotY += deltaX * 0.008;
                    controls.rotX = Math.max(0.1, Math.min(1.2, controls.rotX + deltaY * 0.008));
                    controls.prevX = e.clientX;
                    controls.prevY = e.clientY;
                };
                const onPointerUp = () => { controls.isDragging = false; };

                const dom = renderer.domElement;
                dom.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);

                let isViewerVisible = true;
                const observer = new IntersectionObserver(([entry]) => {
                    isViewerVisible = entry.isIntersecting;
                }, { threshold: 0.05 });
                observer.observe(container);

                let animId;
                const renderLoop = () => {
                    animId = requestAnimationFrame(renderLoop);
                    if (!isViewerVisible) return; // Skip heavy rendering when scrolled away
                    if (!controls.isDragging) controls.rotY += 0.0025;
                    buildingGroup.rotation.y = controls.rotY;
                    buildingGroup.rotation.x = controls.rotX;
                    renderer.render(scene, camera);
                };
                renderLoop();

                const onResize = () => {
                    if (!container) return;
                    const w = container.clientWidth;
                    const h = container.clientHeight;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                    renderer.setSize(w, h);
                };
                window.addEventListener('resize', onResize);

                return () => {
                    cancelAnimationFrame(animId);
                    observer.disconnect();
                    dom.removeEventListener('pointerdown', onPointerDown);
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    window.removeEventListener('resize', onResize);
                    renderer.dispose();
                };
            }, [activeFloor]);

            return (
                <div className="relative w-full h-[360px] sm:h-[420px] rounded-2xl bg-forest-deep/90 border border-gold/30 overflow-hidden shadow-2xl flex items-center justify-center touch-none">
                    <div ref={canvasContainerRef} className="w-full h-full cursor-grab active:cursor-grabbing touch-none select-none" />
                    <div className="absolute top-4 left-4 z-10 flex items-center gap-2 px-3 py-1.5 rounded-full bg-forest/80 backdrop-blur-md border border-gold/30 text-[10px] font-mono text-gold">
                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        <span>INTERACTIVE 3D VILLA PROTOTYPE • DRAG TO ROTATE 360°</span>
                    </div>
                    <div className="absolute bottom-4 right-4 z-10 hidden sm:flex items-center gap-2 text-[10px] font-mono text-white/70 bg-forest/80 px-3 py-1.5 rounded-xl border border-white/10">
                        <span className="text-gold font-bold">Dharti Prangan 3 BHK Villa</span>
                        <span>• Architectural Wireframe</span>
                    </div>
                </div>
            );
        }

                    if (hash === 'performance') mapped = 'performance-marketing';
                    if (hash === 'ai' || hash === 'ai-solutions') mapped = 'ai-automation';

                    if (hash === 'propsouq' || hash === 'proptech') mapped = 'propsouq-ai';

                    const validRoutes = ['digital-marketing', 'performance-marketing', 'ai-automation', 'web-development', 'propsouq-ai', 'work', 'about', 'contact'];

                                        type="email" required placeholder="you@company.com"
                                        value={form.workEmail} onChange={(e) => setForm({...form, workEmail: e.target.value})}
                                        className="w-full bg-[#F8F7F2] border border-forest/10 focus:border-forest rounded-xl px-4 py-3 text-dark outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="text-muted block font-semibold mb-1">Phone Number *</label>
                                    <input 
                                        type="tel" required placeholder="e.g. +91 98765 43210"
                                        value={form.phone} onChange={(e) => setForm({...form, phone: e.target.value})}
                                        className="w-full bg-[#F8F7F2] border border-forest/10 focus:border-forest rounded-xl px-4 py-3 text-dark outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="text-muted block font-semibold mb-1">Service Required</label>
                                    <select 
                                        value={form.serviceRequired} onChange={(e) => setForm({...form, serviceRequired: e.target.value})}
                                        className="w-full bg-[#F8F7F2] border border-forest/10 focus:border-forest rounded-xl px-4 py-3 text-dark outline-none"
                                    >
                                        <option value="Digital Marketing">Digital Marketing & Organic Growth</option>
                                        <option value="Performance Marketing">Performance Marketing & Paid Ads</option>
                                        <option value="AI Automation">AI Automation & Workflows</option>
                                        <option value="AI Agents">Custom AI Agent Development</option>
                                        <option value="Website Development">Website Development & Platforms</option>
                                        <option value="Web-as-a-Service">Web-as-a-Service (WaaS)</option>
                                        <option value="PropSouq AI">PropSouq AI for Real Estate</option>
                                        <option value="Full Growth Architecture">Full Growth System & Automation</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-muted block font-semibold mb-1">Monthly Marketing Budget (Optional)</label>
                                    <select 
                                        value={form.monthlyBudget} onChange={(e) => setForm({...form, monthlyBudget: e.target.value})}
                                        className="w-full bg-[#F8F7F2] border border-forest/10 focus:border-forest rounded-xl px-4 py-3 text-dark outline-none"
                                    >
                                        <option value="Undecided / Discuss during call">Undecided / Discuss during call</option>
                                        <option value="Under ₹50,000 / month">Under ₹50,000 / month</option>
                                        <option value="₹50,000 – ₹1,50,000 / month">₹50,000 – ₹1,50,000 / month</option>
                                        <option value="₹1,50,000 – ₹5,00,000 / month">₹1,50,000 – ₹5,00,000 / month</option>
                                        <option value="₹5,00,000+ / month">₹5,00,000+ / month</option>
                                    </select>
                                </div>

                                <div className="sm:col-span-2">
                                    <label className="text-muted block font-semibold mb-1">Project Requirements & Current Challenges *</label>
                                    <textarea 
                                        rows="3" required placeholder="Tell us about your current customer acquisition channels, operational bottlenecks, or specific requirements..."
                                        value={form.projectRequirements} onChange={(e) => setForm({...form, projectRequirements: e.target.value})}
                                        className="w-full bg-[#F8F7F2] border border-forest/10 focus:border-forest rounded-xl px-4 py-3 text-dark outline-none resize-none"
                                    ></textarea>
                                </div>

                                <div>
                                    <label className="text-muted block font-semibold mb-1">Preferred Contact Method</label>
                                    <div className="flex items-center gap-4 pt-1">
                                        {['Email', 'Phone Call', 'WhatsApp'].map(m => (
                                            <label key={m} className="flex items-center gap-1.5 cursor-pointer text-dark">
                                                <input 
                                                    type="radio" name="contactMethod" value={m} 
                                                    checked={form.preferredContactMethod === m}
                                                    onChange={() => setForm({...form, preferredContactMethod: m})}
                                                    className="accent-forest"
                                                />
                                                <span>{m}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                <div className="text-[11px] text-muted self-end">
                                    <Icon name="lock" className="w-3.5 h-3.5 inline mr-1 text-gold-dark" />
                                    <span>Privacy Guaranteed: We never share your business contact details.</span>
                                </div>

                                <div className="sm:col-span-2 pt-2">
                                    <button 
                                        type="submit"
                                        disabled={isSubmitting}
                                        className="w-full py-4 rounded-xl bg-forest hover:bg-forest-deep text-white font-bold text-sm shadow-soft transition-all btn-luxury-shimmer flex items-center justify-center gap-2 disabled:opacity-50"
                                    >
                                        <span>{isSubmitting ? 'Processing Request...' : 'Submit Consultation Request'}</span>
                                        <Icon name="arrow-up-right" className="w-4 h-4 text-gold" />
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                </section>
            );
        }

        // =========================================================================
        // 15. GLOBAL CONSULTATION MODAL
        // =========================================================================
        function ConsultationModal({ initialTopic, onClose }) {
            const [name, setName] = useState('');
            const [business, setBusiness] = useState('');
            const [email, setEmail] = useState('');
            const [phone, setPhone] = useState('');
            const [topic, setTopic] = useState(initialTopic || 'General Consultation');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submissionResult, setSubmissionResult] = useState(null);

            const handleModalSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                const payload = {
                    name,
                    businessName: business,
                    workEmail: email,
                    phone,
                    serviceRequired: topic,
                    submittedAt: new Date().toISOString(),
                    source: 'Eagle Stack Media Modal Scheduler'
                };
                const res = await submitLeadForm(payload);
                setSubmissionResult(res);
                setIsSubmitting(false);
            };

            const generateMailto = () => {
                const subject = encodeURIComponent(`Consultation Booking: ${business} - ${name}`);
                const body = encodeURIComponent(`Hi Eagle Stack Media Team,\n\nI would like to book a consultation session.\n\n• Name: ${name}\n• Business: ${business}\n• Email: ${email}\n• Phone: ${phone}\n• Discussion Focus: ${topic}\n\nPlease confirm available meeting slots.`);
                return `mailto:${SITE_CONFIG.email}?subject=${subject}&body=${body}`;
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-forest/80 backdrop-blur-sm animate-fade">
                    <div className="bg-white w-full max-w-md rounded-3xl p-6 sm:p-8 border border-forest/15 shadow-2xl space-y-5">
                        <div className="flex items-center justify-between pb-3 border-b border-forest/10">
                            <div>
                                <span className="text-[10px] font-mono text-gold-dark uppercase font-bold">SESSION SCHEDULER</span>
                                <h3 className="text-xl font-display font-bold text-forest">Book a Consultation</h3>
                            </div>
                            <button onClick={onClose} className="p-1 rounded-lg text-muted hover:text-dark">
                                <Icon name="x" className="w-5 h-5" />
                            </button>
                        </div>

                        {submissionResult ? (
                            <div className="py-6 text-center space-y-4">
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center mx-auto ${submissionResult.status === 'delivered' ? 'bg-emerald-100 text-emerald-800' : 'bg-gold/20 text-gold-dark'}`}>
                                    <Icon name={submissionResult.status === 'delivered' ? "check" : "info"} className="w-6 h-6" />
                                </div>
                                <h4 className="text-base font-bold text-forest">
                                    {submissionResult.status === 'delivered' ? 'Consultation Request Delivered' : 'Request Staged in Local Session'}
                                </h4>
                                <p className="text-xs text-muted leading-relaxed">
                                    Thank you, <strong className="text-forest">{name}</strong>. 
                                    {submissionResult.status === 'delivered'
                                        ? ' Your consultation request has reached our team. We will review your context and connect shortly.'
                                        : ' Your request has been recorded in your local browser session backup.'}
                                </p>

                                {submissionResult.status !== 'delivered' && (
                                    <div className="p-3 rounded-xl bg-amber-50 text-[11px] text-amber-900 border border-amber-200 text-left">
                                        <strong>Setup Notice:</strong> Webhook is awaiting live endpoint setup in <code className="font-mono font-bold">SITE_CONFIG.formWebhookUrl</code>. Click below to dispatch directly via email:
                                    </div>
                                )}

                                <div className="pt-2 flex flex-col gap-2">
                                    <a
                                        href={generateMailto()}
                                        className="w-full py-2.5 rounded-xl bg-forest text-white text-xs font-bold flex items-center justify-center gap-1.5"
                                    >
                                        <Icon name="mail" className="w-3.5 h-3.5 text-gold" />
                                        <span>Dispatch via Email</span>
                                    </a>
                                    <button onClick={onClose} className="w-full py-2 rounded-xl bg-muted/10 text-dark text-xs font-semibold">
                                        Close Window
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleModalSubmit} className="space-y-3.5 text-xs">
                                <div>
                                    <label className="text-muted block font-semibold mb-1">Your Name *</label>
                                    <input type="text" required placeholder="Rajesh Kumar" value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-[#F8F7F2] border border-forest/10 rounded-xl px-3.5 py-2 text-dark outline-none" />
                                </div>
                                <div>
                                    <label className="text-muted block font-semibold mb-1">Company / Business *</label>
                                    <input type="text" required placeholder="Avadh Dream Estate" value={business} onChange={(e) => setBusiness(e.target.value)} className="w-full bg-[#F8F7F2] border border-forest/10 rounded-xl px-3.5 py-2 text-dark outline-none" />
                                </div>
                                <div>
                                    <label className="text-muted block font-semibold mb-1">Work Email *</label>
                                    <input type="email" required placeholder="you@company.com" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full bg-[#F8F7F2] border border-forest/10 rounded-xl px-3.5 py-2 text-dark outline-none" />
                                </div>
                                <div>
                                    <label className="text-muted block font-semibold mb-1">Phone Number *</label>
                                    <input type="tel" required placeholder="e.g. +91 98765 43210" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full bg-[#F8F7F2] border border-forest/10 rounded-xl px-3.5 py-2 text-dark outline-none" />
                                </div>
                                <div>
                                    <label className="text-muted block font-semibold mb-1">Discussion Focus</label>
                                    <input type="text" value={topic} onChange={(e) => setTopic(e.target.value)} className="w-full bg-[#F8F7F2] border border-forest/10 rounded-xl px-3.5 py-2 text-dark outline-none font-semibold text-forest" />
                                </div>
                                <button type="submit" disabled={isSubmitting} className="w-full py-3.5 rounded-xl bg-forest text-white font-bold text-xs hover:bg-forest-deep shadow-md btn-luxury-shimmer disabled:opacity-50">
                                    {isSubmitting ? 'Processing...' : 'Confirm Consultation Request'}
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 16. FOOTER (Professional, Fully Featured)
        // =========================================================================
        function Footer({ onNavigate }) {
            return (
                <footer className="border-t border-forest/10 bg-white/95 backdrop-blur-md py-16 text-xs text-muted relative z-10">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                            
                            {/* Brand Info */}
                            <div className="space-y-3">
                                <div className="flex items-center gap-3.5">
                                    <div className="w-11 h-11 flex items-center justify-center shrink-0">
                                        <img src="assets/logo.png" alt="Eagle Stack Media" className="w-full h-full object-contain" />
                                    </div>
                                    <div>
                                        <div className="font-display font-extrabold text-lg text-forest leading-none">
                                            EAGLE STACK <span className="text-gold-dark font-sans font-bold">MEDIA</span>
                                        </div>
                                        <div className="text-[10px] uppercase tracking-widest text-muted mt-1.5 leading-none">Digital Growth & AI Solutions</div>
                                    </div>
                                </div>
                                <p className="text-muted leading-relaxed">
                                    We combine performance marketing, digital experiences, and AI-powered automation to help businesses acquire customers, automate operations, and scale.
                                </p>
                            </div>

                            {/* Main Pages */}
                            <div>
                                <h4 className="font-bold text-forest text-xs uppercase tracking-wider mb-3">Pages</h4>
                                <ul className="space-y-2">
                                    <li><button onClick={() => onNavigate('home')} className="hover:text-forest">Home</button></li>
                                    <li><button onClick={() => onNavigate('digital-marketing')} className="hover:text-forest">Digital Marketing</button></li>
                                    <li><button onClick={() => onNavigate('performance-marketing')} className="hover:text-forest">Performance Marketing</button></li>
                                    <li><button onClick={() => onNavigate('ai-automation')} className="hover:text-forest">AI Automation & Agents</button></li>
                                    <li><button onClick={() => onNavigate('web-development')} className="hover:text-forest">Web Development & WaaS</button></li>
                                    <li><button onClick={() => onNavigate('propsouq-ai')} className="hover:text-forest text-gold-dark font-bold">PropSouq AI (Flagship) ↗</button></li>
                                </ul>
                            </div>

                            {/* Product & Solutions */}
                            <div>
                                <h4 className="font-bold text-forest text-xs uppercase tracking-wider mb-3">Verticals & Flagship</h4>
                                <ul className="space-y-2">
                                    <li><button onClick={() => onNavigate('propsouq-ai')} className="hover:text-forest">PropSouq AI Architecture</button></li>
                                    <li><a href="propsouq.html" target="_blank" rel="noopener noreferrer" className="hover:text-forest text-gold-dark font-bold">Live PropSouq Platform Demo ↗</a></li>
                                    <li><button onClick={() => onNavigate('web-development')} className="hover:text-forest">Web-as-a-Service (WaaS)</button></li>
                                    <li><button onClick={() => onNavigate('ai-automation')} className="hover:text-forest">WhatsApp Business Automation</button></li>
                                    <li><button onClick={() => onNavigate('work')} className="hover:text-forest">Selected Case Studies & Pilots</button></li>
                                </ul>
                            </div>

                            {/* Connect & Legal */}
                            <div>
                                <h4 className="font-bold text-forest text-xs uppercase tracking-wider mb-3">Direct Connect</h4>
                                <div className="space-y-2">
                                    <div className="flex items-center gap-2">
                                        <Icon name="mail" className="w-3.5 h-3.5 text-gold" />
                                        <a href={`mailto:${SITE_CONFIG.email}`} className="hover:text-forest">{SITE_CONFIG.email}</a>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <Icon name="phone" className="w-3.5 h-3.5 text-gold" />
                                        <span>{SITE_CONFIG.phone ? SITE_CONFIG.phone : SITE_CONFIG.phoneDisplay}</span>
                                    </div>
                                    <div className="pt-2 text-muted">
                                        <button onClick={() => onNavigate('contact')} className="hover:text-forest block">Schedule a Consultation</button>
                                        <button onClick={() => onNavigate('about')} className="hover:text-forest block">Company Principles</button>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div className="pt-8 border-t border-forest/10 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] text-muted">
                            <div>© 2026 Eagle Stack Media. All rights reserved.</div>
                            <div className="font-mono text-forest font-semibold">Grow Your Business. Automate What Slows You Down.</div>
                        </div>
                    </div>
                </footer>
            );
        }

        // Mount React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
