            try {
                const existing = JSON.parse(localStorage.getItem('propsouq_leads') || '[]');

                localStorage.setItem('propsouq_leads', JSON.stringify(existing));
            } catch (err) {
                console.warn('LocalStorage backup note:', err);
            }

            // 2. Dispatch to live webhook if configured
            if (SITE_CONFIG.formWebhookUrl && SITE_CONFIG.formWebhookUrl.trim() !== "") {

                    const res = await fetch(SITE_CONFIG.formWebhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                        return { status: 'delivered', message: 'Delivered to PropSouq AI CRM' };
                    } else {
                        return { status: 'webhook_failed', message: `Webhook responded with status ${res.status}` };
                    }

                    return { status: 'network_failed', message: fetchErr.message || 'Network request failed' };

        let psLucideScheduled = false;
        function schedulePsLucideScan() {
            if (psLucideScheduled) return;

                psLucideScheduled = false;
            });

        function Icon({ name, className = "w-4 h-4" }) {
            useEffect(() => {

                    <svg

                        strokeLinecap="round"

                );
            }
            return <i data-lucide={name} className={className}></i>;
        }

        // =========================================================================
        // THREE.JS 3D DIGITAL TWIN MODAL / VIEWER
        // =========================================================================
        function ThreeJsDigitalTwin({ isOpen, onClose, property }) {
            const canvasRef = useRef(null);
            const [lighting, setLighting] = useState('sunset');

            useEffect(() => {
                if (!isOpen || !canvasRef.current || !window.THREE) return;
                const container = canvasRef.current;
                const width = container.clientWidth || 700;
                const height = container.clientHeight || 450;

                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x06261C, 0.015);

                const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
                camera.position.set(14, 10, 16);
                camera.lookAt(0, 1.5, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.innerHTML = '';
                container.appendChild(renderer.domElement);

                const amb = new THREE.AmbientLight(0xe8f0eb, 0.9);
                scene.add(amb);
                const sun = new THREE.DirectionalLight(0xfff3d6, 1.8);
                sun.position.set(12, 18, 12);
                scene.add(sun);

                // Procedural Luxury Villa Mesh
                const root = new THREE.Group();
                scene.add(root);

                const wallMat = new THREE.MeshStandardMaterial({ color: 0xF1F5F2, roughness: 0.8 });
                const baseMat = new THREE.MeshStandardMaterial({ color: 0x0B3B2C, roughness: 0.5 });
                const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x10B981, transparent: true, opacity: 0.45, roughness: 0.1 });
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xC89D3B, metalness: 0.8, roughness: 0.3 });

                // Ground Podium
                const podium = new THREE.Mesh(new THREE.BoxGeometry(14, 0.4, 12), baseMat);
                podium.position.y = -0.2;
                root.add(podium);

                // GF Block
                const gf = new THREE.Mesh(new THREE.BoxGeometry(7, 3, 6), wallMat);
                gf.position.set(-1, 1.5, 0);
                root.add(gf);

                // Glass Balcony
                const glass = new THREE.Mesh(new THREE.BoxGeometry(6, 2.4, 0.2), glassMat);
                glass.position.set(-1, 1.5, 3.1);
                root.add(glass);

                // FF Block
                const ff = new THREE.Mesh(new THREE.BoxGeometry(7.2, 2.8, 6.2), baseMat);
                ff.position.set(-0.8, 4.4, -0.2);
                root.add(ff);

                // Terrace Slats
                for (let i = 0; i < 6; i++) {
                    const slat = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 4.2), goldMat);
                    slat.position.set(-2.8 + i * 0.7, 6.8, 0.4);
                    root.add(slat);
                }

                let isDragging = false;
                let prevMouseX = 0;
                let autoRotate = true;
                let resumeTimer = null;

                const dom = renderer.domElement;
                const onPointerDown = (e) => {
                    isDragging = true;
                    prevMouseX = e.clientX;
                    autoRotate = false;
                    if (resumeTimer) clearTimeout(resumeTimer);
                };
                const onPointerMove = (e) => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - prevMouseX;
                    prevMouseX = e.clientX;
                    root.rotation.y += deltaX * 0.01;
                };
                const onPointerUp = () => {
                    if (isDragging) {
                        isDragging = false;
                        resumeTimer = setTimeout(() => { autoRotate = true; }, 3000);
                    }
                };

                dom.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);

                let animId;
                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    if (autoRotate) {
                        root.rotation.y += 0.005;
                    }
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animId);
                    dom.removeEventListener('pointerdown', onPointerDown);
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUp);
                    if (resumeTimer) clearTimeout(resumeTimer);
                    renderer.dispose();
                };
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl max-w-4xl w-full p-6 space-y-4 shadow-2xl border border-neutral-border">
                        <div className="flex items-center justify-between pb-3 border-b border-neutral-border">
                            <div>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] uppercase font-bold text-brand bg-brand/10 px-2.5 py-1 rounded-full">
                                        Hardware-Accelerated 3D WebGL
                                    </span>
                                    <span className="text-[10px] font-bold text-amber-800 bg-amber-100 px-2.5 py-1 rounded-full">
                                        Procedural Prototype
                                    </span>
                                </div>
                                <h3 className="font-display font-extrabold text-lg text-charcoal mt-1">
                                    360° Architectural Digital Twin • {property?.name || 'Dharti Prangan Luxury Villa'}
                                </h3>
                            </div>
                            <button onClick={onClose} className="text-charcoal-muted hover:text-charcoal p-1 text-lg">✕</button>
                        </div>

                        <div ref={canvasRef} className="h-[420px] rounded-2xl bg-gradient-to-b from-brand-deep to-[#051c14] overflow-hidden cursor-grab active:cursor-grabbing"></div>

                        <div className="p-3 rounded-xl bg-neutral-surface border border-neutral-border text-[11px] text-charcoal-muted leading-relaxed">
                            <strong>Prototype Disclaimer:</strong> This 3D digital twin is a real-time procedural WebGL spatial model demonstrating browser-based architectural visualization. It is an illustrative conceptual representation and does not constitute a certified BIM model, architectural survey, or legal blueprint.
                        </div>

                        <div className="flex items-center justify-between text-xs text-charcoal-muted pt-1">
                            <span>Rotate freely with pointer • Procedural Digital Twin</span>
                            <button onClick={onClose} className="px-5 py-2 rounded-xl bg-brand text-white font-bold text-xs hover:bg-brand-light transition-colors">
                                Close 3D View
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

                    }
                    setMessages([...newHistory, { role: 'ai', text: reply }]);

            return (
                <>
                    {/* Floating Bot Button */}
                    <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
                        {isOpen && (
                            <div className="mb-3 w-80 sm:w-96 rounded-3xl clean-card shadow-2xl border border-neutral-border overflow-hidden animate-fade flex flex-col bg-white">

                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xs text-white">PropSouq AI Advisor</h4>

                                        </div>

                                </div>

                                                    <td className="py-3 px-3 font-bold text-charcoal">{lead.name}</td>
                                                    <td className="py-3 px-3 text-charcoal-muted">{lead.prop}</td>
                                                    <td className="py-3 px-3 font-mono text-charcoal-muted">{lead.source}</td>
                                                    <td className="py-3 px-3 text-charcoal-muted">{lead.engagement}</td>
                                                    <td className="py-3 px-3">
                                                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${lead.intent === 'HIGH' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                            {lead.intent}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-3 font-semibold text-brand">{lead.visit}</td>
                                                    <td className="py-3 px-3 text-right">
                                                        <button 
                                                            onClick={() => showToast(`Opening dialer note for ${lead.name}...`)}
                                                            className="px-2.5 py-1 rounded-lg bg-neutral-surface hover:bg-brand hover:text-white border border-neutral-border text-[11px] font-bold transition-colors"
                                                        >
                                                            Dial Lead
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="p-3 rounded-xl bg-neutral-surface text-charcoal-muted text-[11px] font-mono flex items-center justify-between">
                                    <span>*DEMO DATA • Demonstrates PropSouq buyer qualification telemetry for sales agents.</span>
                                    <button onClick={() => setIsCrmModalOpen(false)} className="px-4 py-1.5 rounded-lg bg-brand text-white font-bold">Close CRM</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* GLOBAL FOOTER */}
                    <footer className="bg-white border-t border-neutral-border py-12 text-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                                <BrandLogo onClick={navigateToHome} />
                                <div className="flex items-center gap-6 text-charcoal font-semibold text-xs">
                                    <button onClick={navigateToHome} className="hover:text-brand">Home</button>
                                    <button onClick={() => openPropertyDetail(properties[0])} className="hover:text-brand">Featured Properties</button>
                                    <a href="index.html" className="hover:text-brand">Eagle Stack Media</a>
                                    <button onClick={() => setIsListPropertyModalOpen(true)} className="hover:text-brand">List Property</button>
                                    <a href="index.html#contact" className="hover:text-brand">Contact Engineering</a>
                                </div>
                            </div>
                            
                            <div className="text-[10px] text-charcoal-muted bg-neutral-surface p-3.5 rounded-2xl border border-neutral-border text-center leading-relaxed">
                                <strong>Interactive Technology Showcase Notice:</strong> PropSouq AI is a specialized real estate digital platform prototype engineered by Eagle Stack Media. It demonstrates browser-based 3D WebGL architectural digital twins, buyer compatibility algorithms, valuation corridors, and qualification CRM telemetry. Listed properties, prices, and metrics are simulated for product demonstration.
                            </div>

                            <div className="flex flex-col sm:flex-row items-center justify-between gap-2 text-charcoal-light text-[11px] pt-4 border-t border-neutral-border">
                                <div>© 2026 PropSouq AI • Interactive Technology Platform by Eagle Stack Media. All rights reserved.</div>
                                <div className="text-charcoal-muted font-medium">Interactive Technology Showcase • 3D Architectural Twins • AI Budget Decisions</div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
